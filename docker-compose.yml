services:
  wordpress:
    depends_on:
      - db
    build: .
    restart: always
    ports:
      # Bound to loopback: a local dev stack with debug on and fixed credentials
      # should not be reachable from the LAN.
      - 127.0.0.1:8083:80
    environment:
      WORDPRESS_DEBUG: true
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - .:/var/www/html/wp-content/plugins/lean-sign-in-with-google
      - ./logs/:/var/log/apache2

  db:
    image: mariadb:10.11
    restart: always
    ports:
      # Loopback only; the wordpress service reaches the db over the internal
      # compose network, so this port is for host-side debugging at most.
      - 127.0.0.1:3309:3306
    environment:
      MARIADB_ROOT_PASSWORD: somewordpress
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
